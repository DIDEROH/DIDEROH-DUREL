    <!-- Applique thème et langue avant le premier rendu pour éviter tout flash.
         La liste des thèmes doit rester alignée avec src/data/site.js. -->
    <script>
      (function () {
        var root = document.documentElement
        var themes = { light: '#ffffff', night: '#0f172a', lemonade: '#f8fdef', cyberpunk: '#fff248', luxury: '#09090b' }
        var theme = null
        var lang = null
        try {
          theme = localStorage.getItem('theme')
          lang = localStorage.getItem('lang')
        } catch (e) {}
        if (!themes[theme]) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'light'
        root.setAttribute('data-theme', theme)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', themes[theme])
        if (lang) root.lang = lang.slice(0, 2)
      })()
    </script>
